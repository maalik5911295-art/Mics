<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK Blaster Mic - Pro Stereo</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        button {
            background-color: #1f6feb;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        button:active {
            transform: scale(0.98);
        }
        #status {
            margin-top: 20px;
            font-size: 16px;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <h1>MK Blaster Mic (Pro)</h1>
    <button id="startBtn">Start Pro Mic</button>
    <div id="status">Microphone is offline</div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const statusDiv = document.getElementById('status');
        let audioCtx, micStream;

        startBtn.addEventListener('click', async () => {
            try {
                // Request raw high-gain audio stream
                micStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false,
                        latency: 0.0
                    }
                });

                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioCtx.createMediaStreamSource(micStream);

                // 1. Create a Stereo Merger to combine dual channels
                const merger = audioCtx.createChannelMerger(2);

                // 2. Create Delay Node for the second channel to create the "Double/Stereo" effect
                const delayNode = audioCtx.createDelay();
                delayNode.delayTime.value = 0.03; // 30ms delay creates heavy vocal body

                // 3. Create a powerful Gain Booster (4.0 = 400% volume)
                const gainNode = audioCtx.createGain();
                gainNode.gain.value = 4.0;

                // Route audio: Source splits into Left (direct) and Right (delayed doubling)
                source.connect(merger, 0, 0); // Left channel
                source.connect(delayNode);     // Delay layer
                delayNode.connect(merger, 0, 1); // Right channel (creates stereo separation)

                // Pass through volume booster to output speakers/headset
                merger.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                statusDiv.innerText = "Status: Pro Stereo Mic Live!";
                statusDiv.style.color = "#3fb950";
                startBtn.innerText = "Running Pro...";
                startBtn.style.backgroundColor = "#238636";

            } catch (err) {
                console.error("Mic error:", err);
                alert("Microphone permission denied or device error.");
                statusDiv.innerText = "Status: Error starting mic";
                statusDiv.style.color = "#f85149";
            }
        });
    </script>
</body>
</html>
