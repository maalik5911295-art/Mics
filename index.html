<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK Blaster Mic - Pro Stereo</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        button {
            background-color: #1f6feb;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        button:active {
            transform: scale(0.98);
        }
        #status {
            margin-top: 20px;
            font-size: 16px;
            color: #8b949e;
            text-align: center;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <h1>MK Blaster Mic (Pro)</h1>
    <button id="startBtn">Start Pro Mic</button>
    <div id="status">Tap button to initialize mic</div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const statusDiv = document.getElementById('status');
        let audioCtx, micStream;

        startBtn.addEventListener('click', async () => {
            try {
                statusDiv.innerText = "Initializing audio...";
                
                // 1. Create or resume AudioContext immediately on click
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                // 2. Request explicit audio stream constraints
                micStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: true,
                        latency: 0.0
                    }
                });

                const source = audioCtx.createMediaStreamSource(micStream);

                // 3. Create Stereo Merger & Delay for heavy vocal body
                const merger = audioCtx.createChannelMerger(2);
                const delayNode = audioCtx.createDelay();
                delayNode.delayTime.value = 0.02; // 20ms doubling effect

                // 4. Massive Volume Booster (8.0 = 800% loud punch)
                const gainNode = audioCtx.createGain();
                gainNode.gain.value = 8.0; 

                // Route audio paths
                source.connect(merger, 0, 0); 
                source.connect(delayNode);     
                delayNode.connect(merger, 0, 1); 

                merger.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                statusDiv.innerText = "Status: PRO MIC LIVE & BOOSTED!";
                statusDiv.style.color = "#3fb950";
                startBtn.innerText = "Running Pro...";
                startBtn.style.backgroundColor = "#238636";

            } catch (err) {
                console.error("Mic error:", err);
                statusDiv.innerText = "Error: Check permissions or plug in wired mic.";
                statusDiv.style.color = "#f85149";
            }
        });
    </script>
</body>
</html>
