<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK Blaster Mic (Pro)</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
        }
        button {
            background-color: #16a34a;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.2s;
        }
        button:active {
            background-color: #15803d;
        }
        #status {
            margin-top: 20px;
            font-size: 0.95rem;
            color: #4ade80;
        }
    </style>
</head>
<body>

    <h1>MK Blaster Mic (Pro)</h1>
    <button id="startBtn" onclick="startProMic()">Start Pro Mic</button>
    <div id="status">Status: Tap to start boosting</div>

    <!-- Hidden audio element to trick Android into keeping background audio alive -->
    <audio id="bgAudio" loop style="display:none;"></audio>

    <script>
        let wakeLock = null;

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log(err);
            }
        }

        async function startProMic() {
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('startBtn');

            try {
                // Request microphone access with high processing settings
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    },
                    video: false
                });

                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                const source = audioCtx.createMediaStreamSource(stream);

                // Create high-gain processor node for massive volume boost
                const gainNode = audioCtx.createGain();
                gainNode.gain.value = 10.0; // 10x Boost

                // Connect audio graph
                source.connect(gainNode);

                const destination = audioCtx.createMediaStreamDestination();
                gainNode.connect(destination);

                // Hook destination stream into background audio element to force background execution
                const bgAudio = document.getElementById('bgAudio');
                bgAudio.srcObject = destination.stream;
                await bgAudio.play();

                // Set up Media Session API to prevent Android from killing the background stream
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.setActionHandler('play', function() {});
                    navigator.mediaSession.setActionHandler('pause', function() {});
                    navigator.mediaSession.playbackState = 'playing';
                }

                // Request screen wake lock to keep session steady
                requestWakeLock();

                btn.innerText = "Running Pro...";
                btn.style.backgroundColor = "#15803d";
                statusDiv.innerText = "Status: Pro Stereo Mic Live & Background Safe!";

            } catch (err) {
                console.error(err);
                statusDiv.style.color = "#ef4444";
                statusDiv.innerText = "Error: Check permissions!";
            }
        }
    </script>
</body>
</html>
